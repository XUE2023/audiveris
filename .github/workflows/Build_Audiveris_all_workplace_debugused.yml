name: Build for Termux (ARM64) and Upload to Release（all_workspace Uesd_debug）


on:
  push:
    branches: [ development, master ]
  pull_request:
    branches: [ development, master ]
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'development'

permissions:
  contents: write

jobs:
  build-termux-arm64:
    runs-on: ubuntu-24.04-arm

    env:
      TESSDATA_PREFIX: /home/runner/.config/AudiverisLtd/audiveris/tessdata

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || (github.event_name == 'release' && github.event.release.tag_name || '') }}
          fetch-depth: 0

      - name: Retrieve Gradle properties
        uses: BrycensRanch/read-properties-action@v1
        id: props
        with:
          file: gradle.properties
          all: true

      - name: Setup Java ${{ steps.props.outputs.theMinJavaVersion }} (ARM64)
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.props.outputs.theMinJavaVersion }}
          distribution: 'zulu'
          architecture: aarch64

      - name: Set environment variable(s)
        run: echo "TESSDATA_TAG=${{ steps.props.outputs.theTessdataTag }}" >> $GITHUB_ENV

      - name: Get cached tessdata files
        id: cache-tessdata
        uses: actions/cache@v5
        with:
          path: ${{ env.TESSDATA_PREFIX }}
          key: ${{ runner.os }}-tessdata-${{ env.TESSDATA_TAG }}-eng

      - name: Install tessdata files
        if: steps.cache-tessdata.outputs.cache-hit != 'true'
        run: |
          ${GITHUB_WORKSPACE}/.github/install-tessdata.sh eng

      - name: Build Audiveris
        uses: gradle/gradle-build-action@v2.7.0
        with:
          arguments: build -x test

      - name: Unit-Test Audiveris
        uses: gradle/gradle-build-action@v2.7.0
        with:
          arguments: test

      - name: Create installation distribution
        uses: gradle/gradle-build-action@v2.7.0
        with:
          arguments: installDist

      # ========== 详细调试：打印完整目录树 ==========
      - name: Debug - Full directory tree
        run: |
          echo "=== Full workspace tree (first 5 levels) ==="
          find . -maxdepth 5 -type d | sort | sed 's/^/  /'
          echo ""
          echo "=== Looking for directories named 'audiveris' ==="
          find . -type d -name "audiveris" | sort
          echo ""
          echo "=== Looking for potential install directories (containing bin and lib) ==="
          find . -type d -exec test -d {}/bin -a -d {}/lib \; -print
          echo ""
          echo "=== Checking app/build/install ==="
          ls -la app/build/install/ 2>/dev/null || echo "app/build/install does not exist"
          echo "=== Checking build/install ==="
          ls -la build/install/ 2>/dev/null || echo "build/install does not exist"
          echo "=== Checking for any .jar files in build output ==="
          find . -name "*.jar" -path "*/build/libs/*" | head -20

      # ========== 始终上传整个工作空间（排除缓存）以便分析 ==========
      - name: Package workspace for debugging (always)
        run: |
          mkdir -p debug-workspace
          rsync -av --exclude='.git' \
                      --exclude='.gradle' \
                      --exclude='**/build/tmp' \
                      --exclude='**/build/.transforms' \
                      --exclude='gradle/wrapper/gradle-*.zip' \
                      ./ debug-workspace/
          tar -czf workspace-debug.tar.gz -C debug-workspace .
        continue-on-error: true

      - name: Upload workspace debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-debug
          path: workspace-debug.tar.gz
          retention-days: 3
        continue-on-error: true

      # ========== 尝试定位安装目录（使用更宽松的条件） ==========
      - name: Locate install directory (fallback)
        id: locate
        run: |
          # 方法1：寻找包含 bin 和 lib 的目录（这是典型的分发结构）
          INSTALL_DIR=$(find . -type d -exec test -d {}/bin -a -d {}/lib \; -print | grep -v "/\.gradle" | head -n 1)
          if [ -n "$INSTALL_DIR" ]; then
            echo "Found install directory via bin+lib: $INSTALL_DIR"
            echo "INSTALL_DIR=$INSTALL_DIR" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 方法2：寻找 audiveris 目录
          INSTALL_DIR=$(find . -type d -name "audiveris" -path "*/install/*" | head -n 1)
          if [ -n "$INSTALL_DIR" ]; then
            echo "Found install directory via audiveris name: $INSTALL_DIR"
            echo "INSTALL_DIR=$INSTALL_DIR" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 方法3：检查 app/build/install
          if [ -d "app/build/install/audiveris" ]; then
            echo "Found at app/build/install/audiveris"
            echo "INSTALL_DIR=app/build/install/audiveris" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 方法4：检查 build/install
          if [ -d "build/install/audiveris" ]; then
            echo "Found at build/install/audiveris"
            echo "INSTALL_DIR=build/install/audiveris" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "No install directory found. See workspace-debug artifact for inspection."
          exit 1

      - name: Prepare Termux package
        if: steps.locate.outputs.INSTALL_DIR != ''
        run: |
          INSTALL_DIR="${{ steps.locate.outputs.INSTALL_DIR }}"
          echo "Using $INSTALL_DIR"
          mkdir -p termux-package
          cp -r "$INSTALL_DIR" termux-package/audiveris

          cat > termux-package/audiveris/bin/audiveris << 'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          APP_HOME="$(dirname "$SCRIPT_DIR")"
          JAVA_CMD="${JAVA_HOME}/bin/java"
          if [ ! -x "$JAVA_CMD" ]; then
              JAVA_CMD="java"
          fi
          export TESSDATA_PREFIX="/data/data/com.termux/files/usr/share/tessdata"
          JVM_OPTS="-Xmx1024m"
          MAIN_CLASS="org.audiveris.app.Main"
          exec "$JAVA_CMD" $JVM_OPTS -cp "$APP_HOME/lib/*" $MAIN_CLASS "$@"
          EOF
          chmod +x termux-package/audiveris/bin/audiveris

      - name: Create archive
        if: steps.locate.outputs.INSTALL_DIR != ''
        run: |
          cd termux-package
          tar -czf ../audiveris-termux-arm64.tar.gz audiveris/
          cd ..
          ls -lh audiveris-termux-arm64.tar.gz

      # ========== 上传到 Release（仅在成功生成 archive 时执行） ==========
      - name: Upload to release (if triggered by release)
        if: github.event_name == 'release' && success() && steps.locate.outputs.INSTALL_DIR != ''
        uses: softprops/action-gh-release@v1
        with:
          files: audiveris-termux-arm64.tar.gz
          tag_name: ${{ github.event.release.tag_name }}

      - name: Upload to nightly release (for continuous builds)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && success() && steps.locate.outputs.INSTALL_DIR != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          files: audiveris-termux-arm64.tar.gz
          fail_on_unmatched_files: true
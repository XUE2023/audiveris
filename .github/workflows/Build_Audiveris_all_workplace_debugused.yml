name: Build Audiveris for Termux (ARM64)

on:
  push:
    branches: [ development, master ]
  pull_request:
    branches: [ development, master ]
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'development'

permissions:
  contents: write   # 允许创建/更新 Release

jobs:
  build-termux-arm64:
    runs-on: ubuntu-24.04-arm   # 原生 ARM64 运行器

    env:
      TESSDATA_PREFIX: /home/runner/.config/AudiverisLtd/audiveris/tessdata

    steps:
      # 1. 检出代码（支持手动输入分支或 Release tag）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || (github.event_name == 'release' && github.event.release.tag_name || '') }}
          fetch-depth: 0

      # 2. 读取 gradle.properties 中的 Java 版本和 Tesseract 数据标签
      - name: Retrieve Gradle properties
        uses: BrycensRanch/read-properties-action@v1
        id: props
        with:
          file: gradle.properties
          all: true

      # 3. 安装 ARM64 版本的 JDK（项目要求的最低版本）
      - name: Setup Java ${{ steps.props.outputs.theMinJavaVersion }} (ARM64)
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.props.outputs.theMinJavaVersion }}
          distribution: 'zulu'
          architecture: aarch64

      # 4. 设置 Tesseract 数据标签环境变量
      - name: Set environment variable(s)
        run: echo "TESSDATA_TAG=${{ steps.props.outputs.theTessdataTag }}" >> $GITHUB_ENV

      # 5. 缓存 Tesseract 数据文件
      - name: Get cached tessdata files
        id: cache-tessdata
        uses: actions/cache@v5
        with:
          path: ${{ env.TESSDATA_PREFIX }}
          key: ${{ runner.os }}-tessdata-${{ env.TESSDATA_TAG }}-eng

      # 6. 下载 Tesseract 数据（如果缓存未命中）
      - name: Install tessdata files
        if: steps.cache-tessdata.outputs.cache-hit != 'true'
        run: |
          ${GITHUB_WORKSPACE}/.github/install-tessdata.sh eng

      # 7. 构建项目（跳过测试以加速，但保留测试步骤）
      - name: Build Audiveris
        uses: gradle/gradle-build-action@v2.7.0
        with:
          arguments: build -x test

      # 8. 运行单元测试（确保代码质量）
      - name: Unit-Test Audiveris
        uses: gradle/gradle-build-action@v2.7.0
        with:
          arguments: test

      # 9. 生成可运行的分发目录（installDist）
      - name: Create installation distribution
        uses: gradle/gradle-build-action@v2.7.0
        with:
          arguments: installDist

      # ========== 轻量级调试：打包安装目录 (installpath) ==========
      - name: Package install directory for debugging (installpath)
        run: |
          # 方法1：寻找同时包含 bin 和 lib 的目录（典型的分发结构）
          INSTALL_DIR=$(find . -type d -exec test -d {}/bin -a -d {}/lib \; -print | grep -v "/\.gradle" | head -n 1)
          if [ -z "$INSTALL_DIR" ]; then
            # 方法2：寻找路径中包含 build/install/audiveris 的目录
            INSTALL_DIR=$(find . -type d -path "*/build/install/audiveris" | head -n 1)
          fi
          if [ -z "$INSTALL_DIR" ]; then
            # 方法3：直接检查常见位置
            if [ -d "app/build/install/audiveris" ]; then
              INSTALL_DIR="app/build/install/audiveris"
            elif [ -d "build/install/audiveris" ]; then
              INSTALL_DIR="build/install/audiveris"
            fi
          fi

          if [ -n "$INSTALL_DIR" ]; then
            echo "Found install directory: $INSTALL_DIR"
            echo "INSTALL_DIR=$INSTALL_DIR" >> $GITHUB_OUTPUT
            # 打包该目录（仅打包安装目录本身，不包含上层路径）
            tar -czf installpath-debug.tar.gz -C "$(dirname "$INSTALL_DIR")" "$(basename "$INSTALL_DIR")"
          else
            echo "No install directory found. Creating empty artifact."
            echo "No install directory found" > installpath-debug.txt
            tar -czf installpath-debug.tar.gz installpath-debug.txt
          fi
        id: debug-install
        continue-on-error: true

      - name: Upload install debug artifact (installpath)
        uses: actions/upload-artifact@v4
        with:
          name: installpath-debug
          path: installpath-debug.tar.gz
          retention-days: 3
        continue-on-error: true

      # ========== 准备 Termux 可运行包 ==========
      # 注意：此步骤依赖上一步中输出的 INSTALL_DIR，若上一步未找到，则跳过
      - name: Prepare Termux package
        if: steps.debug-install.outputs.INSTALL_DIR != ''
        run: |
          INSTALL_DIR="${{ steps.debug-install.outputs.INSTALL_DIR }}"
          echo "Using $INSTALL_DIR"
          mkdir -p termux-package
          cp -r "$INSTALL_DIR" termux-package/audiveris

          # 重写启动脚本，适配 Termux 环境
          cat > termux-package/audiveris/bin/audiveris << 'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          APP_HOME="$(dirname "$SCRIPT_DIR")"
          JAVA_CMD="${JAVA_HOME}/bin/java"
          if [ ! -x "$JAVA_CMD" ]; then
              JAVA_CMD="java"
          fi
          export TESSDATA_PREFIX="/data/data/com.termux/files/usr/share/tessdata"
          JVM_OPTS="-Xmx1024m"
          MAIN_CLASS="org.audiveris.app.Main"
          exec "$JAVA_CMD" $JVM_OPTS -cp "$APP_HOME/lib/*" $MAIN_CLASS "$@"
          EOF
          chmod +x termux-package/audiveris/bin/audiveris

      - name: Create final archive
        if: steps.debug-install.outputs.INSTALL_DIR != ''
        run: |
          cd termux-package
          tar -czf ../audiveris-termux-arm64.tar.gz audiveris/
          cd ..
          ls -lh audiveris-termux-arm64.tar.gz

      # ========== 上传到 Release ==========
      # 如果是 Release 事件，直接上传到该 Release
      - name: Upload to release (if triggered by release)
        if: github.event_name == 'release' && success() && steps.debug-install.outputs.INSTALL_DIR != ''
        uses: softprops/action-gh-release@v1
        with:
          files: audiveris-termux-arm64.tar.gz
          tag_name: ${{ github.event.release.tag_name }}

      # 如果是 push 到主分支或手动触发，则上传到 nightly 预发布（固定名称，自动创建/更新）
      - name: Upload to nightly release (for continuous builds)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && success() && steps.debug-install.outputs.INSTALL_DIR != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          files: audiveris-termux-arm64.tar.gz
          fail_on_unmatched_files: true
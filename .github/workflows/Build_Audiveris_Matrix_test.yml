name: Build for Termux (ARM64)

on:
  push:
    branches: [ development, master ]
  pull_request:
    branches: [ development, master ]
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'development'

jobs:
  build-termux-arm64:
    # 使用 GitHub 提供的 ARM64 运行器（公开仓库可用）
    runs-on: ubuntu-24.04-arm
    # 如果 ubuntu-24.04-arm 不可用，可尝试 ubuntu-22.04-arm 或 ubuntu-latest（但需 QEMU 模拟）
    # 注意：ARM64 运行器目前处于 beta，若不可用可回退到 ubuntu-latest 并通过 QEMU 模拟（但速度慢）

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || (github.event_name == 'release' && github.event.release.tag_name || '') }}

      # 安装构建依赖（Tesseract 开发库，用于 JNI 编译）
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev

      - name: Set up JDK 25 (stable, ARM64)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          architecture: aarch64   # 明确指定 ARM64 架构
          check-latest: true

      - name: Verify Java version and architecture
        run: |
          java -version
          java -XshowSettings:properties -version 2>&1 | grep os.arch

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (ARM64)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Prepare Termux package structure
        run: |
          mkdir -p termux-package/audiveris/bin
          mkdir -p termux-package/audiveris/lib
          cp app/build/libs/audiveris-*.jar termux-package/audiveris/lib/
          cat > termux-package/audiveris/bin/audiveris << 'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          BASE_DIR="$(dirname "$SCRIPT_DIR")"
          JAVA_CMD="${JAVA_HOME}/bin/java"
          if [ ! -x "$JAVA_CMD" ]; then
              JAVA_CMD="java"
          fi
          # 可选：设置 TESSDATA_PREFIX 环境变量（Termux 中 tesseract 数据路径）
          export TESSDATA_PREFIX="/data/data/com.termux/files/usr/share/tessdata"
          exec "$JAVA_CMD" -jar "$BASE_DIR"/lib/audiveris-*.jar "$@"
          EOF
          chmod +x termux-package/audiveris/bin/audiveris

      - name: Create tar.gz archive
        run: |
          cd termux-package
          tar -czf audiveris-termux-arm64.tar.gz audiveris/
          mv audiveris-termux-arm64.tar.gz ../

      - name: Upload artifact (for manual download)
        uses: actions/upload-artifact@v4
        with:
          name: audiveris-termux-arm64
          path: audiveris-termux-arm64.tar.gz

      - name: Upload to release (if release triggered)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: audiveris-termux-arm64.tar.gz
          tag_name: ${{ github.event.release.tag_name }}
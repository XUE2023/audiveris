name: Build for Termux

on:
  push:
    branches: [ development, master ]
  pull_request:
    branches: [ development, master ]
  release:
    types: [ created ]

jobs:
  build-termux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 若需要构建 development 分支，确保检出正确的分支
          ref: development

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          # 项目 Gradle 支持 Java 25，但 Termux 上通常为 17/21，用 21 应能兼容
          # 如需更精确匹配，可改为 '25'（若 GitHub Actions 支持）

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Prepare Termux package structure
        run: |
          mkdir -p termux-package/audiveris/bin
          mkdir -p termux-package/audiveris/lib
          # 复制主 jar 文件（通常位于 app/build/libs/ 下）
          cp app/build/libs/audiveris-*.jar termux-package/audiveris/lib/
          # 创建启动脚本
          cat > termux-package/audiveris/bin/audiveris << 'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          # Termux 启动脚本
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          BASE_DIR="$(dirname "$SCRIPT_DIR")"
          JAVA_CMD="${JAVA_HOME}/bin/java"
          if [ ! -x "$JAVA_CMD" ]; then
              JAVA_CMD="java"
          fi
          exec "$JAVA_CMD" -jar "$BASE_DIR/lib/audiveris-*.jar" "$@"
          EOF
          chmod +x termux-package/audiveris/bin/audiveris
          # 可选：复制示例数据或文档（如有）
          # cp -r data/examples termux-package/audiveris/examples

      - name: Create tar.gz archive
        run: |
          cd termux-package
          tar -czf audiveris-termux.tar.gz audiveris/
          mv audiveris-termux.tar.gz ../

      - name: Upload artifact (for manual download)
        uses: actions/upload-artifact@v4
        with:
          name: audiveris-termux
          path: audiveris-termux.tar.gz

      - name: Upload to release (if release triggered)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: audiveris-termux.tar.gz
          tag_name: ${{ github.event.release.tag_name }}
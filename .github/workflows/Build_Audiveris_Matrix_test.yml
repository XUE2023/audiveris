name: Build for Termux

on:
  push:
    branches: [ development, master ]
  pull_request:
    branches: [ development, master ]
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'development'

jobs:
  build-termux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || (github.event_name == 'release' && github.event.release.tag_name || '') }}

      - name: Set up JDK 25 (stable)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'        # Eclipse Adoptium 提供稳定版 JDK
          java-version: '25'              # 稳定版本号
          check-latest: true

      - name: Verify Java version
        run: java -version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Prepare Termux package structure
        run: |
          mkdir -p termux-package/audiveris/bin
          mkdir -p termux-package/audiveris/lib
          cp app/build/libs/audiveris-*.jar termux-package/audiveris/lib/
          cat > termux-package/audiveris/bin/audiveris << 'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          BASE_DIR="$(dirname "$SCRIPT_DIR")"
          JAVA_CMD="${JAVA_HOME}/bin/java"
          if [ ! -x "$JAVA_CMD" ]; then
              JAVA_CMD="java"
          fi
          exec "$JAVA_CMD" -jar "$BASE_DIR"/lib/audiveris-*.jar "$@"
          EOF
          chmod +x termux-package/audiveris/bin/audiveris

      - name: Create tar.gz archive
        run: |
          cd termux-package
          tar -czf audiveris-termux.tar.gz audiveris/
          mv audiveris-termux.tar.gz ../

      - name: Upload artifact (for manual download)
        uses: actions/upload-artifact@v4
        with:
          name: audiveris-termux
          path: audiveris-termux.tar.gz

      - name: Upload to release (if release triggered)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: audiveris-termux.tar.gz
          tag_name: ${{ github.event.release.tag_name }}
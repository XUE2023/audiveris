name: Build for Termux (ARM64)

on:
  push:
    branches: [ development, master ]
  pull_request:
    branches: [ development, master ]
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'development'

permissions:
  contents: read

jobs:
  build-termux-arm64:
    # 使用 GitHub 原生 ARM64 运行器（公开仓库可用）
    runs-on: ubuntu-24.04-arm

    env:
      # Tesseract 数据路径（与官方 CI 保持一致）
      TESSDATA_PREFIX: /home/runner/.config/AudiverisLtd/audiveris/tessdata

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || (github.event_name == 'release' && github.event.release.tag_name || '') }}
          fetch-depth: 0

      # 读取 gradle.properties 获取 Java 版本和 Tessdata 标签
      - name: Retrieve Gradle properties
        uses: BrycensRanch/read-properties-action@v1
        id: props
        with:
          file: gradle.properties
          all: true

      # 安装 ARM64 版本的 JDK（项目要求的最低版本）
      - name: Setup Java ${{ steps.props.outputs.theMinJavaVersion }} (ARM64)
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.props.outputs.theMinJavaVersion }}
          distribution: 'zulu'
          architecture: aarch64   # 关键：指定 ARM64 架构

      # 设置环境变量（Tessdata 标签）
      - name: Set environment variable(s)
        run: echo "TESSDATA_TAG=${{ steps.props.outputs.theTessdataTag }}" >> $GITHUB_ENV

      # 缓存 Tessdata 文件，避免重复下载
      - name: Get cached tessdata files
        id: cache-tessdata
        uses: actions/cache@v5
        with:
          path: ${{ env.TESSDATA_PREFIX }}
          key: ${{ runner.os }}-tessdata-${{ env.TESSDATA_TAG }}-eng

      # 下载 Tessdata（如果缓存未命中）
      - name: Install tessdata files
        if: steps.cache-tessdata.outputs.cache-hit != 'true'
        run: |
          ${GITHUB_WORKSPACE}/.github/install-tessdata.sh eng

      # 构建（跳过测试，与官方 CI 一致）
      - name: Build Audiveris
        uses: gradle/gradle-build-action@v2.7.0
        with:
          arguments: build -x test

      # 运行单元测试（可选，确保质量）
      - name: Unit-Test Audiveris
        uses: gradle/gradle-build-action@v2.7.0
        with:
          arguments: test

      # 生成完整的分发目录（installDist）
      - name: Create installation distribution
        uses: gradle/gradle-build-action@v2.7.0
        with:
          arguments: installDist

      # 打包为 Termux 可用格式
      - name: Prepare Termux package
        run: |
          # 查找 installDist 生成的目录
          if [ -d "app/build/install/audiveris" ]; then
            INSTALL_DIR="app/build/install/audiveris"
          elif [ -d "build/install/audiveris" ]; then
            INSTALL_DIR="build/install/audiveris"
          else
            echo "ERROR: Cannot find install directory"
            exit 1
          fi

          mkdir -p termux-package
          cp -r "$INSTALL_DIR" termux-package/audiveris

          # 重写启动脚本，适配 Termux 环境
          cat > termux-package/audiveris/bin/audiveris << 'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          APP_HOME="$(dirname "$SCRIPT_DIR")"
          JAVA_CMD="${JAVA_HOME}/bin/java"
          if [ ! -x "$JAVA_CMD" ]; then
              JAVA_CMD="java"
          fi
          # 设置 Tesseract 数据路径（Termux 默认位置）
          export TESSDATA_PREFIX="/data/data/com.termux/files/usr/share/tessdata"
          # JVM 参数（可根据设备调整）
          JVM_OPTS="-Xmx1024m"
          MAIN_CLASS="org.audiveris.app.Main"
          exec "$JAVA_CMD" $JVM_OPTS -cp "$APP_HOME/lib/*" $MAIN_CLASS "$@"
          EOF
          chmod +x termux-package/audiveris/bin/audiveris

      # 打包为 tar.gz
      - name: Create archive
        run: |
          cd termux-package
          tar -czf ../audiveris-termux-arm64.tar.gz audiveris/
          cd ..
          ls -lh audiveris-termux-arm64.tar.gz

      # 上传为 Actions Artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiveris-termux-arm64
          path: audiveris-termux-arm64.tar.gz
          retention-days: 30

      # 如果是 Release 触发，自动上传到 Release
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: audiveris-termux-arm64.tar.gz
          tag_name: ${{ github.event.release.tag_name }}